name: run-and-upload-to-testops

on:
  workflow_dispatch:
    inputs:
      ALLURE_JOB_RUN_ID:
        description: 'TestOps service parameter. Leave blank'
        required: false
      ALLURE_USERNAME:
        description: 'TestOps service parameter. Leave blank'
        required: false
      ENV:
        description: 'Environment (dev/qa/prod)'
        required: false
        default: 'dev'




  pull_request:
    branches:
      - main
    types:
      - closed # только при merge (не при открытии PR)

permissions:
  actions: write
  contents: read

jobs:
  all-tests:
    # Для pull_request запускаем только если PR был смёрджен
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    env:
      ALLURE_ENDPOINT: https://astanahub.testops.cloud
      PRINT_ENV: ${{ secrets.PRINT_ENV }}
      ALLURE_PROJECT_ID: 1
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_JOB_RUN_ID: ${{ github.event.inputs.ALLURE_JOB_RUN_ID }}
      ALLURE_RESULTS: allure-results
      HEADLESS: ${{ secrets.HEADLESS }}
      BROWSER: ${{ secrets.BROWSER }}
      SLOW_MO: ${{ secrets.SLOW_MO }}
      TIMEOUT: ${{ secrets.TIMEOUT }}
      NAVIGATION_TIMEOUT: ${{ secrets.NAVIGATION_TIMEOUT }}
      VIEWPORT_WIDTH: ${{ secrets.VIEWPORT_WIDTH }}
      VIEWPORT_HEIGHT: ${{ secrets.VIEWPORT_HEIGHT }}
      USER_AGENT: ${{ secrets.USER_AGENT }}
      LOCALE: ${{ secrets.LOCALE }}
      TIMEZONE: ${{ secrets.TIMEZONE }}
      TRACE: ${{ secrets.TRACE }}
      SCREENSHOT: ${{ secrets.SCREENSHOT }}
      VIDEO: ${{ secrets.VIDEO }}
      DOWNLOADS_PATH: ${{ secrets.DOWNLOADS_PATH }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      API_TIMEOUT: ${{ secrets.API_TIMEOUT }}
      API_RETRY_ATTEMPTS: ${{ secrets.API_RETRY_ATTEMPTS }}
      API_RETRY_DELAY: ${{ secrets.API_RETRY_DELAY }}
      BASE_DOMAIN: ${{ secrets.BASE_DOMAIN }}
      ADMIN_URL: ${{ secrets.ADMIN_URL }}
      ENV: ${{ github.event.inputs.ENV || 'dev' }}
      LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Debug paths
        run: |
          pwd
          ls -la
          ls -la testdata || true
          ls -la testdata/account_data || true
            
      - name: Print runner IP
        run: curl -s https://api.ipify.org && echo

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: https://astanahub.testops.cloud
          allure-token: ${{ secrets.ALLURE_TOKEN }}
          allure-project-id: 1

      - name: Run tests
        run: allurectl watch -- uv run pytest ./tests --alluredir=allure-results || true
        env:
          ALLURE_RESULTS: allure-results
          ALLURE_JOB_RUN_ID: ${{ github.event.inputs.ALLURE_JOB_RUN_ID }}
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          ALLURE_ENDPOINT: https://astanahub.testops.cloud
          ALLURE_PROJECT_ID: 1
