name: run-and-upload-to-testops

on:
  workflow_dispatch:
    inputs:
      ALLURE_JOB_RUN_ID:
        description: 'TestOps service parameter. Leave blank'
        required: false
      ALLURE_USERNAME:
        description: 'TestOps service parameter. Leave blank'
        required: false

env:
  ALLURE_RESULTS: 'allure-results'
  ALLURE_JOB_RUN_ID: ${{ github.event.inputs.ALLURE_JOB_RUN_ID }}

jobs:
  all-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install allure-pytest pytest

      - name: Install and configure allurectl
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: https://astanahub.testops.cloud # URL твоего TestOps
          allure-token: ${{ secrets.ALLURE_TOKEN }}
          allure-project-id: 1 # ID проекта в TestOps

      - name: Run pytest tests
        run: |
          allurectl watch -- pytest ./tests --alluredir=${ALLURE_RESULTS} --capture=no || true
