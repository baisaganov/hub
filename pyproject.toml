[project]
name = "hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "allure-pytest>=2.15.3",
    "allure-python-commons>=2.15.3",
    "beautifulsoup4~=4.13.4",
    "faker>=40.23.0",
    "httpx>=0.28.1",
    "keyboard~=0.13.5",
    "lorem-text>=3.0",
    "pandas~=2.3.1",
    "playwright~=1.54.0",
    "pydantic>=2.13.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "pytest-base-url>=2.0.0",
    "pytest-order>=1.3.0",
    "pytest-playwright>=0.7.2",
    "pytest-rerunfailures>=12.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.5.0",
    "python-dotenv==1.1.1",
    "requests~=2.32.4",
    "respx>=0.23.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E4/E7/E9 + F — базовые ошибки и pyflakes для всего проекта.
# S101 (assert) и TID251 (запрещённые импорты) включены глобально,
# но через per-file-ignores действуют только в pages/ —
# page objects выполняют действия и возвращают данные, проверки живут в тестах.
select = ["E4", "E7", "E9", "F", "S101", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest".msg = "pages/ не должны зависеть от pytest: skip и проверки — ответственность теста"

[tool.ruff.lint.per-file-ignores]
"!pages/**" = ["S101", "TID251"]
# Реэкспорты в пакетах (from config import config и т.п.)
"**/__init__.py" = ["F401"]
